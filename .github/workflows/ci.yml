name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:cases
      - run: npm run check:leaks
      - run: npm test
      - run: npm run build
        env: { ATHAR_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-12 }
